<style>
:root{--bg:#e8ecf3;--panel:#fff;--ink:#16203a;--mute:#5d6882;--line:#cfd6e4;--accent:#2f4bd8;--slot:#dde3ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2e;--panel:#1d2540;--ink:#eaeefb;--mute:#9aa6c8;--line:#34406a;--accent:#8fa2ff;--slot:#1a2240}}
:root[data-theme="dark"]{--bg:#141a2e;--panel:#1d2540;--ink:#eaeefb;--mute:#9aa6c8;--line:#34406a;--accent:#8fa2ff;--slot:#1a2240}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0}
main{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:4px 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:800 26px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--slot);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.gens{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:22px}
.gt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px}
.gt b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.gt[aria-pressed=true]{border:2px solid var(--accent)}
.gt.off{cursor:default;opacity:.55;border-style:dashed}
.gt small{color:var(--mute)}
.lnk{margin:0 20px 12px;display:inline-block;color:var(--accent);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
input,select,button{font:inherit;color:var(--ink)}
input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input[type=search]{flex:1 1 180px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--bg);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.slot{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:5/7;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.slot.own{background:var(--panel);border:3px solid var(--c);box-shadow:0 2px 0 var(--c)}
.slot.miss{border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel))}
.slot .top{padding:8px 9px;background:var(--c);color:var(--t);font-weight:700;line-height:1.2}
.slot.miss .top{opacity:.75}
.slot .top small{display:block;font-weight:500;opacity:.8;font-size:12px}
.slot .body{flex:1;padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12.5px}
.slot.own .body{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--c) 22%,var(--panel)))}
.slot .body strong{font-size:13.5px}
.slot.miss .body{color:var(--mute);align-items:center;justify-content:center;text-align:center}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
dialog{border:0;border-radius:18px;padding:0;max-width:min(420px,92vw);width:100%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,30,.6)}
.dh{padding:18px 20px;background:var(--c);color:var(--t)}
.dh h2{font-size:26px}
.dl{padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.dl dt{color:var(--mute)}.dl dd{margin:0;font-weight:500}
.nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;cursor:pointer}
.nav button[aria-current=true]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
[hidden]{display:none!important}
.sum{margin:0 0 14px;color:var(--mute)}.sum b{color:var(--ink);font:800 22px "Bricolage Grotesque",sans-serif}
.stack{display:block}
.fold{margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px 14px}
.fold summary{cursor:pointer;padding:10px 0;font:800 20px "Bricolage Grotesque",sans-serif;list-style-position:inside}
.fold summary small{color:var(--mute);font:400 14px "DM Sans",sans-serif;margin-left:6px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.ed{padding:14px 20px;display:grid;gap:10px}
.ed label{display:grid;gap:3px;color:var(--mute);font-size:13px}
.ed input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);width:100%}
.ed .row{display:flex;gap:8px;flex-wrap:wrap}
.pri{background:var(--accent);color:var(--bg)!important;font-weight:700;border-color:var(--accent)!important}
.msg{color:var(--mute);font-size:13px;margin:0 20px 10px}
.dclose{margin:0 20px 18px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}
.gt[style]{border-color:transparent}.gt[style] small{color:inherit;opacity:.85}.gt .bar{background:rgba(0,0,0,.2)}.gt .bar i{background:currentColor}
.gt[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink);border:2px solid transparent}
.nav button[style]{border-color:transparent}.nav button[aria-current=true][style]{box-shadow:0 0 0 3px var(--ink);border-color:transparent}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.acts button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer}
.acts button[aria-pressed=true]{background:var(--accent);color:var(--bg);font-weight:700}
.toast{margin:-6px 0 14px;color:var(--mute);font-size:13px}
.gst{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:22px}
.gtab{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px;align-self:start}
.gtab caption{text-align:left;font:800 16px "Bricolage Grotesque",sans-serif;padding:0 0 6px}
.gtab th,.gtab td{padding:8px 12px;border-top:1px solid var(--line);text-align:left}
.gtab thead th{background:var(--slot);border-top:0;color:var(--mute);font-weight:500}
.gtab tbody th{font-weight:700}.gtab small{color:var(--mute)}
.dclose.add{background:#a8e6e1;color:#000!important;border-color:#7fcfc8;font-weight:700}
.dclose.clr{background:#ffb8b8;color:#3b0a0a;border-color:#f09090}
.hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 16px;padding-top:14px}
.acts{margin:6px 0 0;gap:6px}.acts button{font-size:13px;padding:6px 11px}
@media (max-width:1260px){.acts{margin-right:48px}}
.mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:30;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mus[aria-pressed=true]{background:var(--accent);color:var(--bg)}
.gst{align-items:start}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px 4px}
.gcard h3{margin:0 0 6px;text-align:center;font:800 17px/1.3 "Bricolage Grotesque",sans-serif}
.gtab{border:0;border-radius:0;background:none}
.nav button[data-v=dex]{position:relative;padding:7px 38px 7px 46px;color:#fff;border:2px solid #4a0810;background:linear-gradient(180deg,#f0484f 0,#d02430 45%,#a8141e 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.28),0 2px 0 #4a0810;font-weight:700}
.nav button[data-v=dex][aria-current=true]{color:#fff;border-color:#4a0810;background:linear-gradient(180deg,#f0484f 0,#d02430 45%,#a8141e 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 3px var(--ink)}
.nav button[data-v=dex] span{display:block;padding:1px 12px;border-radius:99px;background:#9fbf94;color:#17301a;border:2px solid #2b2b2e;font:700 13px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.nav button[data-v=dex]::before{content:"";position:absolute;left:9px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;border:2px solid #f4f4f4;background:radial-gradient(circle at 35% 30%,#fff 0 10%,#9fe0ff 22%,#2a86e0 58%,#0b3a7a 100%);box-shadow:0 0 0 2px #2b2b2e}
.nav button[data-v=dex]::after{content:"";position:absolute;right:20px;top:7px;width:5px;height:5px;border-radius:50%;background:#ffd23f;box-shadow:8px 0 #5be37d,16px 0 #ff9a9a;filter:none}
.dclose.pri{background:#8ab4ff;color:#000!important;border-color:#5f93f0}
#close,#lclose{background:#fff;color:#000;border-color:#bbb}

.setb>span{display:block;margin-bottom:4px}.setb .row2{display:flex;flex-direction:column;gap:8px}.setb .lgsel{display:block;width:100%}.setb .tbtn{width:100%;text-align:left;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis}
.setl{min-width:0;width:100%;box-sizing:border-box;max-height:50vh;overflow:auto}
.sfil{width:100%;box-sizing:border-box;position:sticky;top:0;margin-bottom:4px;background:#fff;color:#111}
.sgrp{font-weight:800;font-size:13px;color:#111;padding:9px 6px 3px;margin-top:2px}
.sopt{font-size:13px;color:#111;padding:6px 8px 6px 26px;border-radius:6px;cursor:pointer}
.sopt:hover{background:#e6efff}.sclr{padding-left:8px;color:#555}
.sopt[hidden],.sgrp[hidden]{display:none}
.setb,.setb .row2,.setb .lgsel{min-width:0;max-width:100%;box-sizing:border-box}
.setb .tbtn{min-width:0;max-width:100%;display:block}
.setl{max-width:100%}.setl .sopt,.setl .sgrp{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.rec{display:flex;gap:14px;align-items:center;margin:0 0 18px;padding:12px 14px;background:linear-gradient(135deg,#e7f1ff,#f4ecff);border:1px solid var(--line);border-radius:14px;color:#1c2a3a}
.recimg{flex:none;width:84px;height:84px;display:grid;place-items:center}.recimg img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.rect small{font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#4a5d75;font-size:11px}.rect p{margin:3px 0 8px;font-size:15px}
.recb{display:flex;gap:8px;flex-wrap:wrap}.recb button{border:1px solid #9aa0a6;background:#fff;color:#111;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.recb button:first-child{background:#8ab4ff;border-color:#5f93f0;font-weight:700}
.stv .albbar{gap:8px 14px}.stabs{display:flex;gap:6px;flex-wrap:wrap}.stabs button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.stabs button[aria-pressed=true]{background:#fff;color:#111;font-weight:700}
.stbody{width:min(1100px,100%);box-sizing:border-box;margin:0 auto;padding:16px}
.stbody .stc{background:#fff;color:#1c2a3a;border-radius:14px;padding:14px 16px;margin-bottom:14px}.stbody h3{margin:0 0 10px;font:800 17px "Bricolage Grotesque",sans-serif}.stbody h3 small{font:500 12px "DM Sans",sans-serif}
.stbody .mut,.stbody small.mut{color:#6b7a8d}.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.stg .stc{margin:0}.stg .wide{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.kpi{background:#fff;color:#1c2a3a;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}.kpi b{font:800 24px "Bricolage Grotesque",sans-serif}.kpi span{font-size:12px;color:#6b7a8d}.kpi small{font-size:11px;color:#6b7a8d}
em.up,td.up{color:#1f9d55;font-style:normal;font-weight:700}em.down,td.down{color:#d64545;font-style:normal;font-weight:700}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:13px}.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ht{height:10px;background:#e6ebf2;border-radius:99px;overflow:hidden}.ht i{display:block;height:100%;border-radius:99px;background:#5b8def}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative}.dc::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}.dc span{position:relative;z-index:1;font:800 20px "Bricolage Grotesque",sans-serif}
.dn ul{list-style:none;margin:0;padding:0;font-size:13px}.dn li{display:flex;gap:6px;align-items:center;margin:3px 0}.dn li i{width:10px;height:10px;border-radius:3px}

.stbody .ltab{min-width:0}.stbody .ltab th,.stbody .ltab td{color:#1c2a3a}
.tlg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.tli{display:flex;gap:10px;align-items:center;background:#f3f6fb;border-radius:10px;padding:6px}.tli>div:last-child{display:flex;flex-direction:column;min-width:0}.tli small{color:#6b7a8d;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tlp{flex:none;width:44px;height:60px;display:grid;place-items:center}.tlp img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
.lgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.lgr{background:#eef1f6;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;opacity:.6;filter:grayscale(.7)}.lgr.ok{opacity:1;filter:none;background:linear-gradient(135deg,#fff4c9,#ffe08a)}.lgr small{font-size:11px;color:#51606f}.lgi{font-size:26px}
.lgr .ht i{background:#3a63c7}.lgr.ok .ht i{background:#e0a800}
.rts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.rto{background:#f3f6fb;border-radius:12px;padding:10px}.rto.ok{background:#e1f7e8}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chips span{font-size:11px;padding:2px 8px;border-radius:99px;background:#dfe5ee;color:#6b7a8d}.chips span.on{background:#2e9d5a;color:#fff}
.upl{display:flex;flex-direction:column;gap:6px}.upr{display:grid;grid-template-columns:1fr auto 110px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#f3f6fb}.upr.old{background:#fff3e0}.upn{display:flex;flex-direction:column;min-width:0}.upn small{color:#6b7a8d;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upa{font-size:12px;color:#1d4ed8;white-space:nowrap}.upa.dis{color:#9aa3ad}.upi{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #9aa0a6;border-radius:8px;background:#fff;color:#111}

.alb,.stbody{overscroll-behavior:contain}
.stv{overflow:hidden}.stv .albbar{position:static;flex:none;padding-right:64px}
.stv .stbody{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:none;margin:0;padding:0;-webkit-overflow-scrolling:touch}
.stin{width:min(1100px,100%);box-sizing:border-box;margin:0 auto;padding:16px}
@media (max-width:700px){.stabs{flex:1 1 100%;order:3;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.stabs button{flex:none}.stin{padding:12px}}
#stbtn,#shbtn{border-color:transparent;color:#fff;font-weight:700}
#stbtn{background:linear-gradient(135deg,#7c4dff,#3a63c7)}#shbtn{background:linear-gradient(135deg,#ff7eb3,#ff5e62)}
#stbtn::before{content:"📊 "}#shbtn::before{content:"📤 "}
.ls{display:none}
@media (max-width:700px){.stabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow:visible}.stabs button{padding:7px 2px;font-size:11px;text-align:center;white-space:nowrap}.lf{display:none}.ls{display:inline}}
